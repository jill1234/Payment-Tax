:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#4c4256;background:#f8f6fb;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#eee3f5,#faf5eb);padding:20px max(18px,calc((100vw - 960px)/2));border-bottom:1px solid #e5d9eb}h1{font-size:21px;margin:0 0 5px}h2{font-size:19px;margin:5px 0 15px}h3{font-size:16px;margin:8px 0}p{line-height:1.65}.muted,small{color:#82758a}main{max-width:960px;margin:auto;padding:16px 16px 100px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#f8f6fb;z-index:5}.tabs button{white-space:nowrap}.btn,button{border:1px solid #d8c9e4;background:#fff;color:#655476;border-radius:12px;padding:10px 13px;font-size:14px;cursor:pointer}.btn.primary,button.primary{background:#9e83b6;color:white;border-color:#9e83b6}button.active{background:#e9ddf2;border-color:#b69bc9;font-weight:700}button.danger{color:#aa4f62;border-color:#efcbd2}button:disabled{opacity:.5}.card{background:#fff;border:1px solid #e7dfee;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #8d72900b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat{background:#f4eff8;border-radius:13px;padding:14px}.stat strong{display:block;font-size:20px;margin-top:5px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;border-radius:20px;padding:4px 9px;background:#f1eaf6;color:#715c84}.tag.ok{background:#eaf2e8;color:#53755a}.tag.warn{background:#fff1df;color:#946727}.tag.bad{background:#fdebef;color:#a34b60}.item{border-top:1px solid #eee8f1;padding:13px 0}.item:first-child{border-top:0}.bar{height:8px;border-radius:9px;background:#eee7f2;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:#a98cbe}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(19 </style></head><body><header><h1>🌿 分期繳款與週期性稅務管理</h1><small>個人繳款、稅務與信用卡消費門檻紀錄</small></header><main><nav class="tabs" id="tabs"><button data-tab="home" class="active">總覽</button><button data-tab="installments">分期</button><button data-tab="taxes">稅務</button><button data-tab="cards">信用卡</button><button data-tab="history">歷史</button><button data-tab="settings">備份設定</button></nav><section id="view"></section></main><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button onclick="closeDialog()">關閉</button></div><div id="dialogBody"></div></dialog><footer>資料儲存於本裝置。請定期下載完整備份。</footer><script>
'use strict';const DB='payment-tax-v1',STORES=['installments','taxMasters','taxYears','taxBills','cards','cardPeriods','transactions','attachments','audit','meta'];let db,tab='home',data={};const $=s=>document.querySelector(s),id=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('sv-SE'),money=n=>'NT$ '+(Math.round(Number(n)||0)).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Math.round(Number(v)||0),dateAdd=(d,n,unit)=>{let x=new Date(d+'T12:00:00');if(unit==='week')x.setDate(x.getDate()+n*7);else {const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n*({month:1,quarter:3,year:12}[unit]||1));x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}return x.toLocaleDateString('sv-SE')},monthDay=(year,month,day)=>`${year}-${String(month).padStart(2,'0')}-${String(Math.min(day,new Date(year,month,0).getDate())).padStart(2,'0')}`;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(store,mode='readonly'){return db.transaction(Array.isArray(store)?store:[store],mode)}function all(store){return new Promise((resolve,reject)=>{const r=tx(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(store,key){return new Promise((resolve,reject)=>{const r=tx(store).objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(store,obj){return new Promise((resolve,reject)=>{const t=tx(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}function batch(store,items){return new Promise((resolve,reject)=>{const t=tx(store,'readwrite');for(const o of items)t.objectStore(store).put(o);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function audit(kind,ref,detail){await put('audit',{id:id(),kind,ref,detail,at:new Date().toISOString()})}async function save(store,obj,detail){const old=await get(store,obj.id);await put(store,obj);await audit(store,obj.id,{action:old?'update':'create',old:old||null,new:obj,reason:detail||''});await refresh()}async function refresh(){for(const s of STORES)data[s]=await all(s);render()}function items(store,field,val){return data[store].filter(x=>x[field]===val)}function paid(kind,ref){return items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='payment'&&x.status!=='failed').reduce((a,x)=>a+x.amount,0)-items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='refund').reduce((a,x)=>a+x.amount,0)}function verified(kind,ref){return items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='payment'&&x.status==='verified').reduce((a,x)=>a+x.amount,0)-items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='refund'&&x.status==='verified').reduce((a,x)=>a+x.amount,0)}function status(amount,p,v){return amount<=0?'免繳':p<=0?'未繳':p<amount?'部分繳款':v<p?'待核對':'已核對'}function tag(s){return `<span class="tag ${['已核對','已達標','已結清','免繳'].includes(s)?'ok':['已逾期','未達標'].includes(s)?'bad':'warn'}">${esc(s)}</span>`}function btn(text,action,kind=''){return `<button class="${kind}" onclick="${action}">${text}</button>`}function showDialog(title,body){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialog').showModal()}function closeDialog(){$('#dialog').close()}function field(label,name,type='text',value='',required=true,extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}function sel(label,name,options,value){return `<div><label>${label}</label><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}function formWrap(inner,handler){return `<form onsubmit="event.preventDefault();${handler}(this)"><div class="fields">${inner}</div><div class="actions"><button class="primary" type="submit">儲存</button><button type="button" onclick="closeDialog()">取消</button></div></form>`}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
function render(){const view=$('#view');if(!view)return;view.innerHTML=({home:homeView,installments:installView,taxes:taxView,cards:cardView,history:historyView,settings:settingsView}[tab])()}function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}function noData(s){return `<div class="empty">${s}</div>`}
function homeView(){let dues=[],total=0,paidTotal=0,unverified=0;for(const inst of data.installments.filter(x=>!x.archived)){const entries=inst.periods||[];for(const p of entries){if(p.closed)continue;const a=paid('installment',p.id),v=verified('installment',p.id);total+=Math.max(0,p.amount-a);paidTotal+=a;unverified+=Math.max(0,a-v);if(a<p.amount&&p.due)dues.push({title:inst.name+' 第'+p.n+'期',date:p.due,kind:'分期'})}}for(const bill of data.taxBills.filter(x=>!x.archived&&x.amount!==null&&x.amount!==undefined&&x.state!=='exempt')){const a=paid('tax',bill.id),v=verified('tax',bill.id);total+=Math.max(0,bill.amount-a);paidTotal+=a;unverified+=Math.max(0,a-v);if(a<bill.amount&&bill.due)dues.push({title:bill.name,date:bill.due,kind:'稅務'})}let credit=[];for(const p of data.cardPeriods){const c=data.cards.find(x=>x.id===p.cardId);if(!c||c.archived)continue;const effective=cardEffective(p.id),gap=Math.max(0,p.target-effective);if(gap>0&&p.end>=today()&&daysUntil(p.end)<=7)credit.push({name:c.name,date:p.end,gap})}const notices=dues.filter(x=>daysUntil(x.date)<=7).sort((a,b)=>a.date.localeCompare(b.date));const missing=data.taxBills.filter(x=>x.amount==null&&x.state!=='exempt').length;const last=(data.meta.find(x=>x.id==='lastBackup')||{}).value;const backupOld=!last||daysUntil(last.slice(0,10))< -30;return `<h2>今日總覽</h2><div class="grid"><div class="stat">確定待繳金額<strong>${money(total)}</strong></div><div class="stat">累計淨付款<strong>${money(paidTotal)}</strong></div><div class="stat">待核對金額<strong>${money(unverified)}</strong></div><div class="stat">待填稅額<strong>${missing} 筆</strong></div></div>${backupOld?`<div class="card note">⚠️ ${last?'已超過 30 天未備份':'尚未建立完整備份'}。請至「備份設定」下載資料。</div>`:''}${card('即將到期與逾期',notices.length?notices.map(x=>`<div class="item row"><span>${esc(x.title)} <small>(${x.kind})</small></span><span>${esc(x.date)} ${tag(daysUntil(x.date)<0?'已逾期':'即將到期')}</span></div>`).join(''):noData('目前沒有 7 天內到期或逾期的未繳項目'))}${card('信用卡消費提醒',credit.length?credit.map(x=>`<div class="item row"><span>${esc(x.name)}<br><small>最後刷卡日 ${x.date}</small></span><strong>尚差 ${money(x.gap)}</strong></div>`).join(''):noData('目前沒有需要提醒的信用卡消費門檻'))}<p class="muted">提醒僅在開啟 App 時顯示；未知稅額不列入金額統計。</p>`}
function daysUntil(d){return Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
function installView(){return `<div class="section-title"><h2>分期繳款</h2>${btn('＋ 新增分期','editInstall()','primary')}</div>${data.installments.filter(x=>!x.archived).map(x=>{const periods=x.periods||[],sum=periods.reduce((a,p)=>a+p.amount,0),rem=periods.reduce((a,p)=>a+(p.closed?0:Math.max(0,p.amount-paid('installment',p.id))),0);return card(`${esc(x.name)} ${tag(rem===0?'已結清':'進行中')}`,`<div class="row"><span>原始 ${money(x.original)} ／ 調整後 ${money(sum)}</span><strong>剩餘 ${money(rem)}</strong></div><p class="muted">${periods.length} 期｜${esc(x.cycle)}｜${esc(x.note||'')}</p><div class="actions">${btn('查看期數',`showPeriods('${x.id}')`)}${btn('修改分期',`editInstall('${x.id}')`)}${btn('提前結清',`settleInstall('${x.id}')`)}${btn('歸檔',`archive('installments','${x.id}')`)}</div>`)}).join('')||noData('尚未建立分期資料')}`}
function editInstall(key){const x=data.installments.find(v=>v.id===key);showDialog(x?'修改分期':'新增分期',formWrap(field('分期名稱','name','text',x?.name||'')+(!x?field('總期數','count','number',12,true,'min="1" max="360"'):'')+(!x?sel('金額輸入方式','mode',[['total','輸入總金額'],['each','輸入每期金額']],'total'):'')+(!x?field('金額（新台幣）','amount','number','',true,'min="1" step="1"'):'')+(!x?field('首期繳款日','start','date',today()):'')+sel('繳款週期','cycle',[['week','每週'],['month','每月'],['quarter','每季'],['year','每年']],x?.cycle||'month')+field('備註','note','text',x?.note||'',false),`saveInstall(this,'${key||''}')`))}async function saveInstall(f,key){const v=Object.fromEntries(new FormData(f));let x=data.installments.find(z=>z.id===key);if(x){x={...x,name:v.name,cycle:v.cycle,note:v.note}}else{const count=+v.count,amount=num(v.amount);if(count<1||amount<1)return alert('請輸入有效金額及期數');const total=v.mode==='total'?amount:amount*count,base=Math.floor(total/count),periods=Array.from({length:count},(_,i)=>({id:id(),n:i+1,due:dateAdd(v.start,i,v.cycle),amount:i===count-1?total-base*(count-1):base,closed:false}));x={id:id(),name:v.name,cycle:v.cycle,original:total,periods,note:v.note,created:today(),archived:false}}await save('installments',x);closeDialog()}
function showPeriods(key){const x=data.installments.find(v=>v.id===key);showDialog(x.name,`<p>原始總額 ${money(x.original)}。已付款的期數不可直接修改金額。</p><div class="table-wrap"><table><thead><tr><th>期數</th><th>到期</th><th>應繳</th><th>淨付款</th><th>狀態</th><th>操作</th></tr></thead><tbody>${x.periods.map(p=>{const a=paid('installment',p.id),v=verified('installment',p.id);return `<tr><td>${p.n}</td><td>${p.due}</td><td>${money(p.amount)}</td><td>${money(a)}</td><td>${p.closed?tag('已結清'):tag(status(p.amount,a,v))}</td><td>${!p.closed?btn('付款',`openPayment('installment','${p.id}','${esc(x.name)} 第${p.n}期')`):''}${!p.closed?btn('調整',`editPeriod('${key}','${p.id}')`):''}</td></tr>`}).join('')}</tbody></table></div>`)}function editPeriod(instId,periodId){const x=data.installments.find(v=>v.id===instId),p=x.periods.find(v=>v.id===periodId);if(paid('installment',periodId)!==0)return alert('已有付款的期數不可直接修改金額。');showDialog('修改第 '+p.n+' 期',formWrap(field('應繳金額','amount','number',p.amount,true,'min="0"')+field('到期日','due','date',p.due)+field('修改原因','reason','text','',true),`savePeriod(this,'${instId}','${periodId}')`))}async function savePeriod(f,instId,pid){const v=Object.fromEntries(new FormData(f)),x=data.installments.find(z=>z.id===instId),p=x.periods.find(z=>z.id===pid);const old=p.amount;p.amount=num(v.amount);p.due=v.due;if(!confirm(`原始總額保留 ${money(x.original)}；本期 ${money(old)} 改為 ${money(p.amount)}。確定？`))return;await save('installments',x,v.reason);closeDialog()}function settleInstall(key){const x=data.installments.find(v=>v.id===key);const remaining=x.periods.filter(p=>!p.closed).reduce((s,p)=>s+Math.max(0,p.amount-paid('installment',p.id)),0);showDialog('提前結清',`<p>目前剩餘應繳 ${money(remaining)}。結清後保留原期數。</p>`+formWrap(field('實際結清付款金額','amount','number',remaining,true,'min="0"')+field('結清日期','date','date',today())+field('結清原因／折讓說明','reason','text','提前結清',true),`saveSettlement(this,'${key}')`))}async function saveSettlement(f,key){const v=Object.fromEntries(new FormData(f)),x=data.installments.find(z=>z.id===key),open=x.periods.filter(p=>!p.closed);if(!open.length)return;const due=open.reduce((s,p)=>s+Math.max(0,p.amount-paid('installment',p.id)),0),amt=num(v.amount);if(amt>due||amt<0)return alert('結清金額必須介於 0 與剩餘應繳金額之間');if(!confirm(`結清付款 ${money(amt)}，折讓 ${money(due-amt)}，確定結清？`))return;const p=open[0];let transactionId=null;if(amt){transactionId=id();await put('transactions',{id:transactionId,parentType:'installment',parentId:p.id,type:'payment',amount:amt,date:v.date,status:'pending',method:'其他',note:'提前結清：'+v.reason})}x.settlement={amount:amt,discount:due-amt,date:v.date,reason:v.reason,transactionId,verified:amt===0};if(amt===0)x.periods.forEach(q=>{if(!q.closed){q.closed=true;q.closedReason='提前結清';q.closedAt=v.date}});await save('installments',x,'提前結清；結清付款待核對');closeDialog();alert(amt?'已登記結清付款，請至歷史頁面核對後才會完成結清。':'已記錄零元提前結清。')}
const taxPresets=[['使用牌照稅（自用小客車）',4],['房屋稅',5],['綜合所得稅',5],['汽車燃料使用費（自用車）',7],['地價稅',11]];function taxView(){return `<div class="section-title"><h2>週期性稅務</h2>${btn('＋ 新增稅務','editTaxMaster()','primary')}</div><p class="note">預設月份僅供參考，實際繳納期限以當年度主管機關公告及稅單為準。年度待確認項目不計入應繳金額。</p>${data.taxMasters.filter(x=>!x.archived).map(m=>{const years=items('taxYears','masterId',m.id).sort((a,b)=>b.year-a.year);return card(`${esc(m.name)}｜${esc(m.object)} ${m.active?tag('啟用'):tag('停用')}`,`<p class="muted">預計月份：${m.month} 月｜年度項目 ${years.length} 筆</p><div class="actions">${btn('新增稅單',`editBill('${m.id}')`)}${btn('補建年度',`catchupTax('${m.id}')`)}${btn(m.active?'停用':'啟用',`toggleTax('${m.id}')`)}${btn('歸檔',`archive('taxMasters','${m.id}')`)}</div>${years.map(y=>`<details><summary>${y.year} 年度｜${items('taxBills','yearId',y.id).length} 張稅單</summary>${items('taxBills','yearId',y.id).map(b=>{const p=paid('tax',b.id),v=verified('tax',b.id);return `<div class="item"><div class="row"><strong>${esc(b.name)}</strong>${tag(b.state==='exempt'?'免繳':b.amount==null?'金額待填':status(b.amount,p,v))}</div><small>應繳 ${b.amount==null?'待填':money(b.amount)}｜期限 ${b.due||'待確認'}</small><div class="actions">${btn('修改稅單',`editBill('${m.id}','${b.id}')`)}${b.state!=='exempt'&&b.amount!=null?btn('登記付款',`openPayment('tax','${b.id}','${esc(b.name)}')`):''}</div></div>`}).join('')||'<p class="muted">尚無實際稅單</p>'}</details>`).join('')}`)}).join('')||noData('尚未建立稅務主檔')}`}

function historyView(){let t=data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));const filt=$('#filterType')?.value||'all';if(filt!=='all')t=t.filter(x=>x.parentType===filt);return `<h2>付款與消費歷史</h2><div class="card"><div class="fields">${sel('類別','filterType',[['all','全部'],['installment','分期'],['tax','稅務'],['card','信用卡']],filt)}${field('搜尋日期或備註','searchHistory','search','',false)}</div><div class="actions">${btn('匯出 CSV','exportCSV()')}${btn('列印／另存 PDF','window.print()')}</div><div id="historyRows">${historyRows(t)}</div></div><div class="card"><h3>異動歷史</h3>${data.audit.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,50).map(a=>`<details><summary>${esc(a.at.slice(0,19).replace('T',' '))}｜${esc(a.kind)}｜${esc(a.detail?.action||'修改')}</summary><pre style="white-space:pre-wrap;word-break:break-all;font-size:11px">${esc(JSON.stringify(a.detail,null,2))}</pre></details>`).join('')||noData('尚無異動')}</div>`}function historyRows(list){return list.map(t=>`<div class="item"><div class="row"><span>${esc(t.date)}｜${esc(t.parentType)}｜${esc(t.type)}</span><strong>${money(t.amount)}</strong></div><small>${esc(t.method||t.merchant||'')}｜${esc(t.status)}｜${esc(t.note||'')}</small><div class="actions">${t.parentType!=='card'&&t.type==='payment'?btn(t.status==='verified'?'取消核對':'核對付款',`toggleVerify('${t.id}')`):''}${t.parentType!=='card'&&t.type==='payment'?btn('退款',`refundPayment('${t.id}')`):''}${btn('附件',`attachmentsDialog('${t.id}')`)}</div></div>`).join('')||noData('沒有符合條件的紀錄')}document.addEventListener('input',e=>{if(e.target.id==='searchHistory'){const q=e.target.value.toLowerCase();$('#historyRows').innerHTML=historyRows(data.transactions.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)))}});document.addEventListener('change',e=>{if(e.target.name==='filterType')render()});async function toggleVerify(tid){const t=data.transactions.find(x=>x.id===tid);if(t.status==='verified'){if(!confirm('確定取消核對？異動歷史將保留。'))return;t.status='pending'}else{if(t.status==='failed')return alert('失敗付款不可核對');t.status='verified'}await save('transactions',t,'核對狀態變更');for(const x of data.installments){if(x.settlement?.transactionId===tid){const done=t.status==='verified';x.settlement.verified=done;x.periods.forEach(p=>{p.closed=done;p.closedReason=done?'提前結清':'';p.closedAt=done?x.settlement.date:null});await save('installments',x,'結清核對狀態變更')}}}function refundPayment(tid){const t=data.transactions.find(x=>x.id===tid),used=data.transactions.filter(x=>x.originalId===tid&&x.type==='refund').reduce((s,x)=>s+x.amount,0);showDialog('登記退款',formWrap(field('退款金額','amount','number',t.amount-used,true,`min="1" max="${t.amount-used}"`)+field('退款日期','date','date',today())+field('退款原因','reason','text','',true),`savePaymentRefund(this,'${tid}')`))}async function savePaymentRefund(f,tid){const v=Object.fromEntries(new FormData(f)),t=data.transactions.find(x=>x.id===tid),used=data.transactions.filter(x=>x.originalId===tid&&x.type==='refund').reduce((s,x)=>s+x.amount,0);if(num(v.amount)<1||num(v.amount)>t.amount-used)return alert('退款金額不正確');await save('transactions',{id:id(),parentType:t.parentType,parentId:t.parentId,originalId:tid,type:'refund',amount:num(v.amount),date:v.date,status:'pending',note:v.reason});closeDialog()}
async function attachmentsDialog(tid){const list=items('attachments','transactionId',tid);showDialog('付款／消費憑證',`<p>每筆最多 5 個附件，每個不超過 10 MB。附件僅儲存在本機，請定期備份。</p><input type="file" id="attFiles" accept="image/*,application/pdf" multiple><div class="actions">${btn('儲存附件',`uploadAttachments('${tid}')`,'primary')}</div>${list.map(a=>`<div class="item row"><span>${esc(a.name)} (${(a.size/1048576).toFixed(1)} MB)</span><span>${btn('開啟',`openAttachment('${a.id}')`)}${btn('刪除',`removeAttachment('${a.id}')`,'danger')}</span></div>`).join('')}`)}async function uploadAttachments(tid){const fs=Array.from($('#attFiles').files),old=items('attachments','transactionId',tid);if(fs.length+old.length>5)return alert('每筆最多 5 個附件');if(fs.some(f=>f.size>10*1048576))return alert('每個附件不可超過 10 MB');try{for(const f of fs){if(!f.type.startsWith('image/')&&f.type!=='application/pdf')return alert('僅支援圖片與 PDF');await put('attachments',{id:id(),transactionId:tid,name:f.name,type:f.type,size:f.size,blob:f})}await audit('attachments',tid,{action:'upload',count:fs.length});await refresh();attachmentsDialog(tid)}catch(e){alert('儲存附件失敗，可能是儲存空間不足：'+e.message)}}async function openAttachment(aid){const a=data.attachments.find(x=>x.id===aid);const url=URL.createObjectURL(a.blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}async function removeAttachment(aid){if(!confirm('確定刪除這個附件？請先備份。'))return;const a=data.attachments.find(x=>x.id===aid);await new Promise((resolve,reject)=>{const t=tx('attachments','readwrite');t.objectStore('attachments').delete(aid);t.oncomplete=resolve;t.onerror=()=>reject(t.error)});await audit('attachments',aid,{action:'delete',name:a.name});await refresh();attachmentsDialog(a.transactionId)}async function archive(store,key){if(!confirm('確定歸檔？資料與歷史仍保留。'))return;const x=data[store].find(v=>v.id===key);x.archived=true;await save(store,x,'歸檔')}
function settingsView(){const last=data.meta.find(x=>x.id==='lastBackup')?.value||'尚未備份';return `<h2>備份與設定</h2>${card('完整備份',`<p>最後備份：${esc(last)}</p><p>完整 ZIP 包含三個模組的主檔、交易、異動歷史與附件。請將檔案另存到安全位置。</p><div class="actions">${btn('下載完整 ZIP 備份','backupZIP()','primary')}${btn('匯出 CSV','exportCSV()')}${btn('列印／另存 PDF','window.print()')}</div>`)}${card('完整還原',`<p>還原將取代本裝置全部資料。必須先下載目前資料的安全備份，再選擇還原 ZIP。</p><input id="restoreFile" type="file" accept=".zip,application/zip"><div class="actions">${btn('檢查並還原 ZIP','restoreZIP()','danger')}</div>`)}${card('離線與儲存',`<p>安裝至 iPhone 主畫面後，首次連網載入完成即可測試離線使用。資料存放於瀏覽器 IndexedDB，不會自動同步到其他裝置。</p><p>請勿清除網站資料。iOS 可能管理或移除網站儲存內容，務必定期備份。</p>`)}${card('版本資訊','<p>V1.0｜單機本機資料｜新台幣整數｜無銀行連線｜無背景推播</p>')}`}
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}function exportCSV(){const rows=[['日期','類別','種類','金額','狀態','方式／商店','備註'],...data.transactions.map(t=>[t.date,t.parentType,t.type,t.amount,t.status,t.method||t.merchant||'',t.note||''])];download(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'繳款交易_'+today()+'.csv')}
// Self-contained ZIP (stored entries, no third-party CDN; offline-capable).
const encoder=new TextEncoder(),decoder=new TextDecoder();function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=c&1?(c>>>1)^0xedb88320:c>>>1}return(c^-1)>>>0}function u16(d,o,n){d.setUint16(o,n,true)}function u32(d,o,n){d.setUint32(o,n>>>0,true)}function concat(parts){let n=parts.reduce((s,p)=>s+p.length,0),a=new Uint8Array(n),pos=0;for(const p of parts){a.set(p,pos);pos+=p.length}return a}function zipMake(files){const local=[],central=[];let offset=0;for(const f of files){const name=encoder.encode(f.name),body=f.bytes,crc=crc32(body),lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,8,0);u32(v,14,crc);u32(v,18,body.length);u32(v,22,body.length);u16(v,26,name.length);lh.set(name,30);local.push(lh,body);const ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u32(w,16,crc);u32(w,20,body.length);u32(w,24,body.length);u16(w,28,name.length);u32(w,42,offset);ch.set(name,46);central.push(ch);offset+=lh.length+body.length}const cd=concat(central),end=new Uint8Array(22),v=new DataView(end.buffer);u32(v,0,0x06054b50);u16(v,8,files.length);u16(v,10,files.length);u32(v,12,cd.length);u32(v,16,offset);return new Blob([...local,cd,end],{type:'application/zip'})}function zipRead(buf){const b=new Uint8Array(buf),v=new DataView(buf),out=new Map();let end=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('找不到 ZIP 目錄');const count=v.getUint16(end+10,true);if(count>20000)throw Error('附件數量異常');let pos=v.getUint32(end+16,true);for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('ZIP 目錄錯誤');const method=v.getUint16(pos+10,true),crc=v.getUint32(pos+16,true),size=v.getUint32(pos+20,true),n=v.getUint16(pos+28,true),extra=v.getUint16(pos+30,true),comment=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true),name=decoder.decode(b.slice(pos+46,pos+46+n));if(method!==0)throw Error('僅支援本 App 產生的 ZIP');if(v.getUint32(offset,true)!==0x04034b50)throw Error('ZIP 項目錯誤');const start=offset+30+v.getUint16(offset+26,true)+v.getUint16(offset+28,true),bytes=b.slice(start,start+size);if(bytes.length!==size||crc32(bytes)!==crc)throw Error('檔案校驗失敗：'+name);if(out.has(name))throw Error('ZIP 重複檔名');out.set(name,bytes);pos+=46+n+extra+comment}return out}
async function backupZIP(){try{const snapshot={version:1,created:new Date().toISOString(),stores:{}};for(const s of STORES)if(s!=='attachments')snapshot.stores[s]=await all(s);const atts=await all('attachments'),files=[];for(const a of atts){const name='attachments/'+a.id;files.push({name,bytes:new Uint8Array(await a.blob.arrayBuffer())})}snapshot.attachments=atts.map(({blob,...rest})=>rest);files.unshift({name:'records.json',bytes:encoder.encode(JSON.stringify(snapshot))});download(zipMake(files),'繳款稅務管理_完整備份_'+today()+'.zip');await put('meta',{id:'lastBackup',value:new Date().toISOString()});await refresh();alert('已啟動備份下載。請確認 ZIP 確實保存到裝置或雲端。')}catch(e){alert('備份失敗：'+e.message)}}
async function restoreZIP(){const f=$('#restoreFile')?.files?.[0];if(!f)return alert('請選擇 ZIP 檔');try{const zip=zipRead(await f.arrayBuffer()),json=zip.get('records.json');if(!json)throw Error('找不到 records.json');const snap=JSON.parse(decoder.decode(json));if(snap.version!==1)throw Error('不支援的備份版本');for(const s of STORES.filter(s=>s!=='attachments')){if(!Array.isArray(snap.stores?.[s]))throw Error('缺少資料表：'+s);const ids=new Set();for(const o of snap.stores[s]){if(!o||typeof o.id!=='string'||ids.has(o.id))throw Error('資料 ID 異常：'+s);ids.add(o.id)}}if(!Array.isArray(snap.attachments))throw Error('缺少附件清單');const att=[];for(const a of snap.attachments){const bytes=zip.get('attachments/'+a.id);if(!bytes||bytes.length!==a.size)throw Error('附件缺少或大小不符：'+a.name);att.push({...a,blob:new Blob([bytes],{type:a.type})})}const msg=`備份日期：${snap.created}\n交易 ${snap.stores.transactions.length} 筆，附件 ${att.length} 個。\n\n還原將完整取代現有資料。請先點「下載完整 ZIP 備份」並確認檔案已保存。`;if(!confirm(msg))return;if(!confirm('再次確認：你已完成現有資料的安全備份，並同意完整取代？'))return;await new Promise((resolve,reject)=>{const t=tx(STORES,'readwrite');for(const s of STORES){const store=t.objectStore(s);store.clear();const rows=s==='attachments'?att:snap.stores[s];for(const o of rows)store.put(o)}t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('容量不足，已取消還原'))});await refresh();alert('還原完成，資料已重新載入。')}catch(e){alert('還原未完成，原資料應保持不變：'+e.message)}}
async function init(){try{db=await openDB();for(const s of STORES)data[s]=await all(s);await ensureTaxYears();for(const c of data.cards.filter(x=>x.active&&!x.archived))await createCardPeriods(c);await refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){$('#view').innerHTML=`<div class="card">無法啟動本機資料庫：${esc(e.message)}。請使用 HTTPS 網址或 localhost 開啟。</div>`}}init();
</script></body></html>
